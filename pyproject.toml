[project]
name = "mlops-sample"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
train = [
    "joblib>=1.6.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
    "torch>=2.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]
addopts = "-ra"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
